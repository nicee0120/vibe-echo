<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIBE ECHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000000;--deep:#081028;--panel:rgba(10,11,6,.96);--line:rgba(212,255,26,.2);
  --text:#f6f8ee;--muted:#a7ad98;--cyan:#d4ff1a;--violet:#ffffff;--crimson:#ff4d6d;--gold:#d4ff1a;--amber:#f2f2ea;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--void:#000000;--text:#f6f8ee;}}
:root[data-theme="dark"]{--void:#000000;--text:#f6f8ee;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#141a05 0%,var(--void) 60%);color:var(--text);
  font-family:"Oxanium","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:52px}
#hud[hidden],#foot[hidden]{display:none}
.hud-l{display:flex;flex-direction:column;min-width:130px}
#h-stage{font-weight:800;font-size:15px;letter-spacing:.02em}
#h-phase{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
#h-phase.rec::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--crimson);box-shadow:0 0 8px var(--crimson)}
#h-phase.live::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.hud-stats{display:flex;gap:16px;flex-wrap:wrap;flex:1}
.st{display:flex;flex-direction:column;line-height:1.15}
.st .k{font-size:11px;color:var(--muted)}
.st .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px;margin-top:3px}
.pip{width:10px;height:10px;transform:rotate(45deg);border:1.5px solid var(--cyan);border-radius:2px}
.pip.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
.icon-btn:hover{border-color:var(--cyan)}
#stage-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
#canvas-box{flex:1;min-height:0;position:relative}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#touch{display:none;height:150px;flex:none;position:relative;touch-action:none}
body.touch #touch{display:flex;justify-content:space-between;align-items:center;padding:0 18px}
#joy{width:124px;height:124px;border-radius:50%;border:2px solid rgba(212,255,26,.35);background:rgba(212,255,26,.05);position:relative;touch-action:none}
#joy-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(212,255,26,.35);border:2px solid var(--cyan)}
#tbtns{display:grid;grid-template-columns:repeat(2,auto);gap:10px}
#tbtns button{width:76px;height:58px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-weight:600;touch-action:none}
#tbtns button[data-t="use"]{border-color:var(--amber);color:var(--amber)}
#tbtns button[data-t="pulse"]{border-color:var(--violet);color:var(--violet)}
#tbtns button[data-t="seal"]{border-color:var(--crimson);color:var(--crimson)}
#tbtns button:disabled{opacity:.3}
#foot{padding:4px 14px 8px;border-top:1px solid var(--line)}
#hint{margin:4px 0 4px;font-size:14px;color:var(--text);min-height:20px;max-width:900px}
#tl{width:100%;height:58px;display:block}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,4,12,.62);z-index:10;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#overlay.show{display:flex}
#overlay.menu-bg{background:transparent}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:600px;width:100%;max-height:100%;overflow:auto;padding:24px 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
.panel h2{margin:0 0 6px;font-size:26px;font-weight:800}
.panel h3{margin:20px 0 6px;font-size:17px;color:var(--cyan)}
.panel p,.panel li{color:#d9dccf;line-height:1.55;font-size:15px;max-width:66ch}
.panel ul{padding-left:20px;margin:6px 0}
.sub{color:var(--muted);margin:0 0 14px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btns.row{flex-direction:row;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:rgba(255,255,255,.04);padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:600;font-size:16px;text-align:left;min-height:48px}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--cyan);color:#0a0a00;border-color:var(--cyan)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.warn{border-color:var(--crimson);color:#ffd2da}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.btn.primary small{color:#3a4a00}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.title{font-size:clamp(30px,8.5vw,60px);font-weight:800;letter-spacing:.05em;margin:4px 0 6px 28px;line-height:1.1;color:#fff;white-space:nowrap;
  text-shadow:-10px 0 0 rgba(212,255,26,.55),-20px 0 0 rgba(212,255,26,.28),-30px 0 0 rgba(212,255,26,.12),0 0 22px rgba(212,255,26,.5)}
.menu-panel{background:transparent;border:none;box-shadow:none;max-width:520px;overflow:visible}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:#e4e7da}
.chip.danger{border-color:rgba(255,77,109,.6);color:#ffc2cd}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:13px;margin:0 2px;color:var(--text)}
.toggle{display:flex;justify-content:space-between;align-items:center}
.toggle .state{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.toggle[aria-pressed="true"] .state{background:var(--cyan);color:#0a0a00;border-color:var(--cyan)}
.illus{width:100%;max-width:420px;height:auto;display:block;margin:8px 0}
.lock{color:var(--muted)}
.chargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:12px}
.charcard{border:1.5px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.charcard img{height:96px;width:auto;max-width:100%;object-fit:contain;image-rendering:auto}
.charcard:hover{border-color:var(--cyan)}
.charcard[aria-pressed="true"]{border-color:var(--cyan);background:rgba(212,255,26,.1);box-shadow:0 0 18px rgba(212,255,26,.25)}
@media (max-width:640px){
  #hud{gap:6px 10px;padding:6px 10px}
  .hud-l{flex:1;min-width:0}
  .hud-stats{gap:6px 14px;order:3;flex-basis:100%}
  .st .k{font-size:10px}
  .st .v{font-size:14px}
  .panel{padding:18px 16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hud" hidden>
    <div class="hud-l"><span id="h-stage"></span><span id="h-phase"></span></div>
    <div class="hud-stats">
      <div class="st"><span class="k">Health</span><span id="h-hp" class="pips"></span></div>
      <div class="st"><span class="k">Energy</span><span id="h-en" class="v"></span></div>
      <div class="st"><span class="k">Time left</span><span id="h-time" class="v"></span></div>
      <div class="st"><span class="k">Echoes active</span><span id="h-echo" class="v"></span></div>
      <div class="st"><span class="k">Pulse charges</span><span id="h-pulse" class="v"></span></div>
    </div>
    <button id="b-pause" class="icon-btn" aria-label="Pause">Pause</button>
  </header>
  <main id="stage-wrap">
    <div id="canvas-box"><canvas id="game" aria-label="Game arena"></canvas></div>
    <div id="touch">
      <div id="joy" aria-label="Movement joystick"><div id="joy-knob"></div></div>
      <div id="tbtns">
        <button data-t="use">Use</button>
        <button data-t="pulse">Pulse</button>
        <button data-t="seal">Seal</button>
        <button data-t="pause">Pause</button>
      </div>
    </div>
  </main>
  <footer id="foot" hidden>
    <p id="hint"></p>
    <canvas id="tl" aria-label="Replay timeline"></canvas>
  </footer>
</div>
<div id="overlay"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

function parseMap(def){
  var rows=def.map, h=rows.length, w=rows[0].length;
  var out={w:w,h:h,tiles:new Array(w*h),gateAt:{},start:null,exit:null,fragments:[],switches:[],gates:[],plates:[],mines:[],lasers:[],spikes:[]};
  for(var y=0;y<h;y++){
    if(rows[y].length!==w) throw new Error('Row '+y+' of '+def.id+' has width '+rows[y].length+', expected '+w);
    for(var x=0;x<w;x++){
      var ch=rows[y][x], t=ch;
      if(ch==='P'){out.start={x:x+0.5,y:y+0.5};t='.';}
      else if(ch==='O'){out.exit={x:x,y:y};t='O';}
      else if(ch==='e'){out.fragments.push({x:x+0.5,y:y+0.5});t='.';}
      else if(ch==='m'){out.mines.push({x:x+0.5,y:y+0.5});t='.';}
      else if(/[a-d]/.test(ch)){out.switches.push({x:x,y:y,id:ch.toUpperCase()});t='s';}
      else if(/[A-D]/.test(ch)){out.gates.push({x:x,y:y,id:ch});out.gateAt[y*w+x]=ch;t='G';}
      else if(/[1-4]/.test(ch)){out.plates.push({x:x,y:y,id:'ABCD'[+ch-1]});t='p';}
      else if(ch==='L'){out.lasers.push({x:x,y:y});t='L';}
      else if(ch==='x'){out.spikes.push({x:x,y:y});t='x';}
      else if(ch!=='#'&&ch!=='.') throw new Error('Unknown map char '+ch);
      out.tiles[y*w+x]=t;
    }
  }
  out.lasers.forEach(function(L){
    var hz=(tileAt(out,L.x-1,L.y)==='L'||tileAt(out,L.x+1,L.y)==='L');
    L.orient=hz?'h':'v';
  });
  if(!out.start||!out.exit) throw new Error('Map '+def.id+' needs P and O');
  return out;
}
function tileAt(m,x,y){ if(x<0||y<0||x>=m.w||y>=m.h) return '#'; return m.tiles[y*m.w+x]; }

function createStage(def){

    hp:def.maxHp,pulses:def.pulses,status:'playing',failReason:null,failSource:null,result:null,
    stats:{damage:0,echoDamage:0,echoSwitch:0,echoPlateTicks:0,blockedTicks:0,echoMines:0,pulsesUsed:0,assisted:{},collectedLive:0,collectedRec:0},
    fx:[]};

}
function beginPhase(s){

  s.gateTimer={};s.gateTimerByEcho={};s.gateOpen={};s.gateEcho={};
  m.gates.forEach(function(g){s.gateTimer[g.id]=0;s.gateOpen[g.id]=false;s.gateEcho[g.id]=false;});
  s.plateOn=m.plates.map(function(){return false;});
  s.mines=m.mines.map(function(mm){return {x:mm.x,y:mm.y,state:0,fuse:0,byEcho:false};});
  s.echoes=s.recordings.map(function(r,i){
    var a=r.samples[0];

function nextPhase(s){

function samplePos(rec,t){

  var S=rec.samples, i=Math.floor(t/SAMPLE_EVERY);

function interact(s,x,y,byEcho){

function updateGates(s){
  var m=s.m,p=s.player,held={},heldEcho={};
  m.plates.forEach(function(pl,i){
    var cx=pl.x+0.5,cy=pl.y+0.5,on=false;

      if(e.active&&Math.abs(e.x-cx)<0.5&&Math.abs(e.y-cy)<0.5){on=true;heldEcho[pl.id]=true;s.stats.echoPlateTicks++;}
    }
    if(on) held[pl.id]=true;

  var ids={};
  m.gates.forEach(function(g){ids[g.id]=ids[g.id]||[];ids[g.id].push(g);});

function damage(s,amt,src){
  var p=s.player;
  if(s.def.practice) return;
  if(p.inv>0||s.status!=='playing') return;
  s.hp=Math.max(0,s.hp-amt); p.inv=INV_TICKS; s.stats.damage+=amt;
  if(src==='echo'||src==='echoMine') s.stats.echoDamage+=amt;
  s.fx.push({type:'hurt',x:p.x,y:p.y,src:src});
  if(s.hp<=0) fail(s,'health',src);
}
function fail(s,reason,src){ s.status='lost'; s.failReason=reason; s.failSource=src||null; s.fx.push({type:'lost'}); }

function doPulse(s){
  if(s.pulses<=0||s.pulseCd>0){ s.fx.push({type:'pulseFail'}); return -1; }
  s.pulses--; s.pulseCd=PULSE_COOLDOWN; s.stats.pulsesUsed++;
  var p=s.player,n=0;
  s.echoes.forEach(function(e){ if(e.active&&Math.hypot(e.x-p.x,e.y-p.y)<=PULSE_RADIUS){e.disrupt=PULSE_TICKS;n++;} });
  s.fx.push({type:'pulse',x:p.x,y:p.y,n:n});
  return n;
}

  s.rec.len=s.phaseTick;
  s.recordings.push(s.rec);
  s.status='phaseEnd';
  s.fx.push({type:'sealed'});

      if(mn.fuse<=0){
        mn.state=2; s.fx.push({type:'boom',x:mn.x,y:mn.y});
        if(mn.byEcho) s.stats.echoMines++;
        if(Math.hypot(p.x-mn.x,p.y-mn.y)<MINE_RADIUS){ p.inv=0; damage(s,MINE_DAMAGE,mn.byEcho?'echoMine':'mine'); }
      }
    }
  }
  // 6. energy (only the live player collects; replays never duplicate rewards)
  for(i=0;i<m.fragments.length;i++){
    if(s.fragTaken[i]) continue;
    var f=m.fragments[i];
    if(Math.hypot(p.x-f.x,p.y-f.y)<PICK_R){
      s.fragTaken[i]=true; s.banked++;
      if(s.isLive) s.stats.collectedLive++; else s.stats.collectedRec++;
      s.fx.push({type:'pick',x:f.x,y:f.y});
    }
  }
  // 7. exit (live phase only)
  if(s.status==='playing'&&s.isLive&&s.banked>=def.required&&Math.hypot(p.x-(m.exit.x+0.5),p.y-(m.exit.y+0.5))<EXIT_R){
    s.status='won';
    s.result={timeLeft:(s.phaseLen-s.phaseTick)/60,energy:s.banked,damage:s.stats.damage,echoes:s.recordings.length};
    s.fx.push({type:'won'});
  }
  s.phaseTick++;
  if(s.status!=='playing') return;
  if(s.rec&&input.seal&&s.phaseTick>=MIN_SEAL_TICKS){ endRecording(s); return; }
  if(s.phaseTick>=s.phaseLen){ if(s.rec) endRecording(s); else fail(s,'time'); }
}

function snapshot(s){
  var r=function(v){return Math.round(v*1e6)/1e6;};
  return JSON.stringify({ph:s.phaseIndex,t:s.phaseTick,p:[r(s.player.x),r(s.player.y)],hp:s.hp,b:s.banked,st:s.status,
    e:s.echoes.map(function(e){return [r(e.x),r(e.y),e.active,e.disrupt];}),g:s.gateOpen,mines:s.mines.map(function(mm){return mm.state;})});
}

/* reachability check used by tests: all non-wall tiles passable */
function reachable(def){
  var m=parseMap(def),seen={},q=[[Math.floor(m.start.x),Math.floor(m.start.y)]];
  seen[q[0][1]*m.w+q[0][0]]=true;
  while(q.length){ var c=q.shift();
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var nx=c[0]+d[0],ny=c[1]+d[1],k=ny*m.w+nx;
      if(!seen[k]&&tileAt(m,nx,ny)!=='#'){seen[k]=true;q.push([nx,ny]);}});
  }
  return {exit:!!seen[m.exit.y*m.w+m.exit.x],
    fragments:m.fragments.every(function(f){return seen[Math.floor(f.y)*m.w+Math.floor(f.x)];}),
    exitInWall:tileAt(m,m.exit.x,m.exit.y)==='#'};
}

/* ===== save data ===== */
var SAVE_KEY='afterimage-save-v1';
function defaultSave(){ return {v:1,unlocked:1,best:{},character:'capper',settings:{sound:true,reducedMotion:false,shake:true}}; }
function sanitizeSave(raw){
  var d=defaultSave();
  if(!raw||typeof raw!=='object') return d;
  if(typeof raw.unlocked==='number'&&isFinite(raw.unlocked)) d.unlocked=Math.max(1,Math.min(STAGES.length,Math.floor(raw.unlocked)));
  if(raw.best&&typeof raw.best==='object'){
    STAGES.forEach(function(st){ var v=raw.best[st.id]; if(typeof v==='number'&&isFinite(v)&&v>=0) d.best[st.id]=v; });
  }
  if(typeof raw.character==='string'&&/^[a-z]{2,16}$/.test(raw.character)) d.character=raw.character;
  if(raw.settings&&typeof raw.settings==='object'){
    ['sound','reducedMotion','shake'].forEach(function(k){ if(typeof raw.settings[k]==='boolean') d.settings[k]=raw.settings[k]; });
  }
  return d;
}
function loadSave(storage,hasPref){
  try{ var txt=storage&&storage.getItem(SAVE_KEY); if(!txt){ var d=defaultSave(); if(hasPref) d.settings.reducedMotion=true; return d; } return sanitizeSave(JSON.parse(txt)); }
  catch(err){ return defaultSave(); }
}
function writeSave(storage,data){
  try{ storage.setItem(SAVE_KEY,JSON.stringify(sanitizeSave(data))); return true; }catch(err){ return false; }
}

  MINE_FUSE:MINE_FUSE,MINE_RADIUS:MINE_RADIUS,INV_TICKS:INV_TICKS,STAGES:STAGES,parseMap:parseMap,tileAt:tileAt,createStage:createStage,
  step:step,nextPhase:nextPhase,samplePos:samplePos,laserOn:laserOn,doPulse:doPulse,isSolid:isSolid,snapshot:snapshot,reachable:reachable,
  SAVE_KEY:SAVE_KEY,defaultSave:defaultSave,sanitizeSave:sanitizeSave,loadSave:loadSave,writeSave:writeSave};
})(typeof window!=='undefined'?window:globalThis);
</script>

      var nx=dx/R,ny=dy/R; if(Math.hypot(nx,ny)<0.18){nx=0;ny=0;} joy.x=nx;joy.y=ny; }
  jz.addEventListener('pointerdown',function(ev){ ev.preventDefault(); joy.id=ev.pointerId; try{jz.setPointerCapture(ev.pointerId);}catch(e){} upd(ev); });
  jz.addEventListener('pointermove',function(ev){ if(ev.pointerId===joy.id) upd(ev); });
  function rel(ev){ if(ev.pointerId===joy.id){ joy.id=null; joy.x=joy.y=0; knob.style.transform=''; } }
  jz.addEventListener('pointerup',rel); jz.addEventListener('pointercancel',rel);
  Array.prototype.forEach.call(document.querySelectorAll('#tbtns button'),function(b){
    b.addEventListener('pointerdown',function(ev){ ev.preventDefault(); var t=b.getAttribute('data-t');
      if(t==='pause'){ if(mode==='play'&&!overlay.classList.contains('show')) openPause(); return; }
      if(mode==='play'&&!paused) edges[t]=true; });
  });
  document.addEventListener('touchmove',function(ev){ if(mode==='play'&&!overlay.classList.contains('show')) ev.preventDefault(); },{passive:false});
}

/* ---------- layout ---------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  var r=box.getBoundingClientRect(); W=Math.max(1,r.width); H=Math.max(1,r.height);
  cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr);
  var tr=tl.getBoundingClientRect(); TW=Math.max(1,tr.width); TH=Math.max(1,tr.height);
  tl.width=Math.round(TW*dpr); tl.height=Math.round(TH*dpr);
  trail=[];
  layout();
}
function layout(){
  if(!game) return;
  var m=game.m,pad=6;
  ts=Math.max(6,Math.floor(Math.min((W-pad*2)/m.w,(H-pad*2)/m.h)));
  ox=Math.floor((W-ts*m.w)/2); oy=Math.floor((H-ts*m.h)/2);
  buildStatic();
}
if(window.ResizeObserver){ new ResizeObserver(function(){resize();}).observe(box); }
window.addEventListener('resize',resize);

/* ---------- static layer ---------- */
function buildStatic(){
  var m=game.m,T=ts;
  staticLayer=document.createElement('canvas');
  staticLayer.width=Math.ceil(m.w*T*dpr); staticLayer.height=Math.ceil(m.h*T*dpr);
  var c=staticLayer.getContext('2d'); c.scale(dpr,dpr);
  c.fillStyle='#0b0d07'; c.fillRect(0,0,m.w*T,m.h*T);
  c.strokeStyle='rgba(212,255,26,0.05)'; c.lineWidth=1; c.beginPath();
  for(var x=0;x<=m.w;x++){c.moveTo(x*T+.5,0);c.lineTo(x*T+.5,m.h*T);}
  for(var y=0;y<=m.h;y++){c.moveTo(0,y*T+.5);c.lineTo(m.w*T,y*T+.5);}
  c.stroke();
  for(y=0;y<m.h;y++) for(x=0;x<m.w;x++){
    var t=Core.tileAt(m,x,y),px=x*T,py=y*T;
    if(t==='#'){
      c.fillStyle='#000000'; c.fillRect(px,py,T,T);
      c.strokeStyle='rgba(212,255,26,0.05)'; c.lineWidth=1; c.beginPath(); c.moveTo(px,py+T); c.lineTo(px+T,py); c.stroke();
      c.strokeStyle='rgba(212,255,26,0.4)'; c.lineWidth=Math.max(1,T*0.05); c.beginPath();
      if(x>0&&Core.tileAt(m,x-1,y)!=='#'){c.moveTo(px+.5,py);c.lineTo(px+.5,py+T);}
      if(x<m.w-1&&Core.tileAt(m,x+1,y)!=='#'){c.moveTo(px+T-.5,py);c.lineTo(px+T-.5,py+T);}
      if(y>0&&Core.tileAt(m,x,y-1)!=='#'){c.moveTo(px,py+.5);c.lineTo(px+T,py+.5);}
      if(y<m.h-1&&Core.tileAt(m,x,y+1)!=='#'){c.moveTo(px,py+T-.5);c.lineTo(px+T,py+T-.5);}
      c.stroke();
    } else if(t==='x'){
      c.fillStyle='rgba(255,138,61,0.12)'; c.fillRect(px,py,T,T);
      c.fillStyle='#ff8a3d';
      for(var k=0;k<4;k++){ var sx=px+(k%2)*T/2,sy=py+Math.floor(k/2)*T/2; c.beginPath();
        c.moveTo(sx+T*0.06,sy+T*0.44); c.lineTo(sx+T*0.25,sy+T*0.06); c.lineTo(sx+T*0.44,sy+T*0.44); c.closePath(); c.fill(); }
    } else if(t==='p'){
      c.strokeStyle='rgba(242,242,234,0.7)'; c.lineWidth=Math.max(1.5,T*0.06);
      c.strokeRect(px+T*0.12,py+T*0.12,T*0.76,T*0.76);
    }
  }
}

/* ---------- drawing helpers ---------- */
function W2(x){return x*ts;}
function diamond(c,x,y,r){c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r,y);c.lineTo(x,y+r);c.lineTo(x-r,y);c.closePath();}
function hexagon(c,x,y,r){c.beginPath();for(var i=0;i<6;i++){var a=Math.PI/3*i+Math.PI/6;c[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();}
var ECHO_COLORS=['#e9ff8a','#ffffff','#b8e000'];
function echoColor(i){ return game.def.echoHarm?'#ff4d6d':ECHO_COLORS[i%ECHO_COLORS.length]; }
function font(px,w){ return (w||600)+' '+Math.round(px)+'px Oxanium, "Segoe UI", system-ui, sans-serif'; }

function render(alpha){
  var c=ctx; c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle='#000000'; c.fillRect(0,0,W,H);
  if(!game||!staticLayer){ drawIdle(c); return; }
  var s=game,m=s.m,T=ts,t=s.phaseTick,rm=settings.reducedMotion;
  var sx=0,sy=0;
  if(shake>0&&settings.shake&&!rm){ sx=(Math.random()-0.5)*T*0.3*shake/0.3; sy=(Math.random()-0.5)*T*0.3*shake/0.3; }
  c.save(); c.translate(ox+sx,oy+sy);
  c.drawImage(staticLayer,0,0,m.w*T,m.h*T);
  // lasers
  m.lasers.forEach(function(L){
    var on=Core.laserOn(s,L,t),px=L.x*T,py=L.y*T;
    var warn=!on&&Core.laserOn(s,L,t+20);
    c.fillStyle=on?'rgba(255,77,109,0.25)':(warn?'rgba(255,77,109,0.1)':'rgba(255,77,109,0.04)'); c.fillRect(px,py,T,T);
    c.strokeStyle=on?'#ff4d6d':'rgba(255,77,109,'+(warn?0.5:0.22)+')';
    c.lineWidth=on?Math.max(2,T*0.14):Math.max(1,T*0.04);
    c.setLineDash(on?[]:[T*0.12,T*0.12]);
    c.beginPath();
    if(L.orient==='h'){c.moveTo(px,py+T/2);c.lineTo(px+T,py+T/2);} else {c.moveTo(px+T/2,py);c.lineTo(px+T/2,py+T);}
    c.stroke(); c.setLineDash([]);
    if(on){ c.save(); c.shadowColor='#ff4d6d'; c.shadowBlur=T*0.5; c.stroke(); c.restore(); }
  });
  // plates
  m.plates.forEach(function(pl,i){
    if(s.plateOn[i]){ c.fillStyle='rgba(242,242,234,0.35)'; c.fillRect(pl.x*T+T*0.12,pl.y*T+T*0.12,T*0.76,T*0.76); }
    c.fillStyle='rgba(242,242,234,0.95)'; c.font=font(T*0.34); c.textAlign='center'; c.textBaseline='middle';
    c.fillText(String('ABCD'.indexOf(pl.id)+1),pl.x*T+T/2,pl.y*T+T/2);
  });
  // switches
  m.switches.forEach(function(sw){
    var cx=sw.x*T+T/2,cy=sw.y*T+T/2,r=T*0.32,timer=s.gateTimer[sw.id]||0,max=Math.round(s.def.switchOpen*60);
    c.fillStyle='rgba(242,242,234,0.12)'; c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.fill();
    c.strokeStyle='#f2f2ea'; c.lineWidth=Math.max(1.5,T*0.06); c.stroke();
    if(timer>0){ c.fillStyle='rgba(242,242,234,0.85)'; c.beginPath(); c.moveTo(cx,cy); c.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*timer/max); c.closePath(); c.fill(); }
    c.fillStyle=timer>0?'#000000':'#f2f2ea'; c.font=font(T*0.36,800); c.textAlign='center'; c.textBaseline='middle';
    c.fillText(sw.id.toLowerCase(),cx,cy+1);
  });
  // gates
  m.gates.forEach(function(g){
    var px=g.x*T,py=g.y*T,open=s.gateOpen[g.id];
    if(open){ c.strokeStyle='rgba(242,242,234,0.45)'; c.lineWidth=1.5; c.setLineDash([T*0.1,T*0.1]); c.strokeRect(px+2,py+2,T-4,T-4); c.setLineDash([]);
      var gt=s.gateTimer[g.id]||0; if(gt>0){ c.fillStyle='#f2f2ea'; c.fillRect(px+T*0.1,py+T*0.84,T*0.8*gt/Math.round(s.def.switchOpen*60),T*0.1); } }
    else{
      c.fillStyle='rgba(34,36,28,0.95)'; c.fillRect(px,py,T,T);
      c.fillStyle='#f2f2ea';
      var vert=Core.tileAt(m,g.x,g.y-1)==='#'||Core.tileAt(m,g.x,g.y+1)==='#';
      for(var k=0;k<3;k++){ if(vert) c.fillRect(px+T*(0.18+k*0.25),py+T*0.06,T*0.12,T*0.88); else c.fillRect(px+T*0.06,py+T*(0.18+k*0.25),T*0.88,T*0.12); }
    }
    c.fillStyle=open?'rgba(242,242,234,0.8)':'#ffffff'; c.font=font(T*0.3,800); c.textAlign='center'; c.textBaseline='middle';
    c.save(); if(!open){ c.fillStyle='#000000'; c.fillRect(px+T*0.32,py+T*0.32,T*0.36,T*0.36); c.fillStyle='#d4ff1a'; }
    c.fillText(g.id,px+T/2,py+T/2+1); c.restore();
  });
  // exit
  (function(){
    var ex=m.exit,cx=ex.x*T+T/2,cy=ex.y*T+T/2,ready=s.isLive&&s.banked>=s.def.required;
    c.lineWidth=Math.max(2,T*0.08);
    c.strokeStyle=ready?'#ffffff':(s.isLive?'rgba(212,255,26,0.55)':'rgba(212,255,26,0.25)');
    var rot=rm?0:clock*1.4;
    c.setLineDash(ready?[T*0.18,T*0.1]:[T*0.05,T*0.12]);
    c.save(); c.translate(cx,cy); c.rotate(ready?rot:0); c.beginPath(); c.arc(0,0,T*0.4,0,Math.PI*2); c.stroke(); c.restore(); c.setLineDash([]);
    if(ready){ c.save(); c.shadowColor='#d4ff1a'; c.shadowBlur=T*0.6; c.fillStyle='rgba(212,255,26,0.35)'; c.beginPath(); c.arc(cx,cy,T*0.26,0,Math.PI*2); c.fill(); c.restore(); }
    c.fillStyle=ready?'#ffffff':'rgba(200,230,255,0.75)'; c.font=font(T*0.26); c.textAlign='center'; c.textBaseline='middle';
    c.fillText(s.isLive?(ready?'EXIT':s.banked+'/'+s.def.required):'live',cx,cy+1);
  })();
  // fragments
  m.fragments.forEach(function(f,i){
    if(s.fragTaken[i]) return;
    var bob=rm?0:Math.sin(clock*3+i)*T*0.05, cx=f.x*T, cy=f.y*T+bob;
    c.save(); c.shadowColor='#d4ff1a'; c.shadowBlur=T*0.4; c.fillStyle='#d4ff1a'; diamond(c,cx,cy,T*0.2); c.fill(); c.restore();
    c.fillStyle='#ffffff'; diamond(c,cx,cy,T*0.08); c.fill();
  });
  // mines
  s.mines.forEach(function(mn){
    var cx=mn.x*T,cy=mn.y*T;
    if(mn.state===2){ c.fillStyle='rgba(255,77,109,0.12)'; c.beginPath(); c.arc(cx,cy,T*0.35,0,Math.PI*2); c.fill(); return; }
    hexagon(c,cx,cy,T*0.26);
    if(mn.state===1){ var f=1-mn.fuse/Core.MINE_FUSE; c.fillStyle='rgba(255,77,109,'+(0.4+0.5*f)+')'; c.fill();
      c.strokeStyle='rgba(255,77,109,0.6)'; c.lineWidth=1.5; c.beginPath(); c.arc(cx,cy,T*Core.MINE_RADIUS*f,0,Math.PI*2); c.stroke(); }
    else { c.fillStyle='rgba(255,77,109,0.15)'; c.fill(); }
    hexagon(c,cx,cy,T*0.26); c.strokeStyle='#ff4d6d'; c.lineWidth=Math.max(1.5,T*0.06); c.stroke();
    c.fillStyle='#ff4d6d'; c.beginPath(); c.arc(cx,cy,T*0.06,0,Math.PI*2); c.fill();
  });
  // echo routes: full route faint, next 1.5 s bright
  s.echoes.forEach(function(e){
    var S=e.rec.samples,col=echoColor(e.i);
    c.strokeStyle=col; c.globalAlpha=0.16; c.lineWidth=Math.max(1,T*0.05); c.setLineDash([T*0.08,T*0.14]);
    c.beginPath(); S.forEach(function(p,k){ c[k?'lineTo':'moveTo'](p[1]*T,p[2]*T); }); c.stroke(); c.setLineDash([]);
    if(e.active){
      c.globalAlpha=0.6; c.lineWidth=Math.max(1.5,T*0.08); c.beginPath(); var started=false;
      for(var tt=t;tt<=Math.min(e.rec.len-1,t+90);tt+=3){ var p=Core.samplePos(e.rec,tt); if(!p) break; c[started?'lineTo':'moveTo'](p.x*T,p.y*T); started=true; }
      c.stroke();
    }
    c.globalAlpha=1;
    e.rec.events.forEach(function(ev){ if(ev.t<t) return; var p=Core.samplePos(e.rec,ev.t); if(!p) return;
      c.strokeStyle=col; c.lineWidth=1.5; diamond(c,p.x*T,p.y*T,T*0.16); c.stroke(); });
  });
  // current recording trail
  if(s.rec&&s.rec.samples.length){
    c.strokeStyle='rgba(212,255,26,0.35)'; c.lineWidth=Math.max(1,T*0.06); c.beginPath();
    s.rec.samples.forEach(function(p,k){ c[k?'lineTo':'moveTo'](p[1]*T,p[2]*T); });
    c.lineTo(s.player.x*T,s.player.y*T); c.stroke();
    s.rec.events.forEach(function(ev){ var sm=s.rec.samples[Math.floor(ev.t/Core.SAMPLE_EVERY)]; if(!sm) return;
      c.strokeStyle='rgba(212,255,26,0.7)'; diamond(c,sm[1]*T,sm[2]*T,T*0.14); c.stroke(); });
  }
  // echoes: translucent copies of your character
  s.echoes.forEach(function(e){
    if(!e.active) return;
    var x=(e.px+(e.x-e.px)*alpha)*T,y=(e.py+(e.y-e.py)*alpha)*T,r=Core.ECHO_R*T,col=echoColor(e.i),dis=e.disrupt>0;
    c.globalAlpha=dis?0.25:(e.separated?0.9:0.5);
    c.strokeStyle=col; c.lineWidth=Math.max(1.5,T*0.06);
    c.setLineDash(dis?[T*0.06,T*0.1]:(s.def.echoSolid?[]:[T*0.12,T*0.08]));
    if(s.def.echoHarm){ hexagon(c,x,y+T*0.18,r*1.15); } else { c.beginPath(); c.ellipse(x,y+T*0.2,r*1.2,r*0.55,0,0,Math.PI*2); }
    c.stroke(); c.setLineDash([]);
    var gimg=ghostOf(charId(),s.def.echoHarm?'#ff4d6d':col);
    c.globalAlpha=dis?0.18:(e.separated?0.62:0.35);
    if(gimg){ var gh=T*1.25,gw=gh*gimg.width/gimg.height; c.save(); c.translate(x,y); if(Math.cos(e.dir)<-0.1) c.scale(-1,1); c.drawImage(gimg,-gw/2,-gh*0.8,gw,gh); c.restore(); }
    c.globalAlpha=dis?0.3:1;
    var bx=x+T*0.42,by=y-T*0.78; c.fillStyle=s.def.echoHarm?'#ff4d6d':col; c.beginPath(); c.arc(bx,by,T*0.17,0,Math.PI*2); c.fill();
    c.fillStyle='#000'; c.font=font(T*0.24,800); c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(e.i+1),bx,by+1);
    c.globalAlpha=1;
  });
  // pulse radius
  var p=s.player,px=(p.px+(p.x-p.px)*alpha)*T,py=(p.py+(p.y-p.py)*alpha)*T;
  if(s.pulses>0&&s.echoes.some(function(e){return e.active;})){
    c.strokeStyle='rgba(255,255,255,0.22)'; c.lineWidth=1; c.setLineDash([4,6]); c.beginPath(); c.arc(px,py,Core.PULSE_RADIUS*T,0,Math.PI*2); c.stroke(); c.setLineDash([]);
  }
  // player trail
  trail.forEach(function(q,k){ c.fillStyle='rgba(212,255,26,'+(0.18*k/trail.length)+')'; c.beginPath(); c.arc(q[0],q[1],Core.PLAYER_R*T*(0.4+0.6*k/trail.length),0,Math.PI*2); c.fill(); });
  // player: your chosen character
  if(Math.cos(p.dir)<-0.1) facingLeft=true; else if(Math.cos(p.dir)>0.1) facingLeft=false;
  c.fillStyle='rgba(212,255,26,0.25)'; c.beginPath(); c.ellipse(px,py+T*0.2,Core.PLAYER_R*T*1.2,Core.PLAYER_R*T*0.55,0,0,Math.PI*2); c.fill();
  c.strokeStyle='#d4ff1a'; c.lineWidth=Math.max(1.5,T*0.06); c.stroke();
  var pim=IMG[charId()];
  c.save(); c.globalAlpha=p.inv>0?0.55:1;
  if(pim&&pim.complete&&pim.naturalWidth){ var ph=T*1.25,pw=ph*pim.naturalWidth/pim.naturalHeight; c.translate(px,py); if(facingLeft) c.scale(-1,1); c.drawImage(pim,-pw/2,-ph*0.8,pw,ph); }
  else { c.fillStyle='#d4ff1a'; c.beginPath(); c.arc(px,py,Core.PLAYER_R*T,0,Math.PI*2); c.fill(); }
  c.restore();
  // rings and particles
  rings.forEach(function(rg){ var f=rg.t/rg.max; c.strokeStyle=rg.color; c.globalAlpha=1-f; c.lineWidth=Math.max(1.5,T*0.08);
    c.beginPath(); c.arc(rg.x*T,rg.y*T,rg.r*T*(rm?1:f),0,Math.PI*2); c.stroke(); c.globalAlpha=1; });
  particles.forEach(function(q){ c.globalAlpha=Math.max(0,q.life/q.max); c.fillStyle=q.color; c.fillRect(q.x*T-q.s/2,q.y*T-q.s/2,q.s,q.s); });
  c.globalAlpha=1;
  c.restore();
  if(trail.length===0||Math.hypot(trail[trail.length-1][0]-px,trail[trail.length-1][1]-py)>T*0.15){ trail.push([px,py]); if(trail.length>(rm?4:12)) trail.shift(); }
}
function drawIdle(c){
  var g=40; c.strokeStyle='rgba(212,255,26,0.05)'; c.lineWidth=1; c.beginPath();
  for(var x=0;x<W;x+=g){c.moveTo(x+.5,0);c.lineTo(x+.5,H);} for(var y=0;y<H;y+=g){c.moveTo(0,y+.5);c.lineTo(W,y+.5);} c.stroke();
}

function drawTimeline(){
  var c=tctx; c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,TW,TH);
  if(!game) return;
  var s=game,rows=[{label:s.isLive?'You (live)':'You (rec)',color:'#d4ff1a',len:s.phaseTick,events:s.rec?s.rec.events:[],self:true}];
  s.echoes.forEach(function(e){ rows.push({label:'Echo '+(e.i+1),color:echoColor(e.i),len:e.rec.len,events:e.rec.events,active:e.active}); });
  var rh=Math.min(17,(TH-4)/rows.length),labW=74,bw=Math.max(10,TW-labW-6),L=s.phaseLen,t=s.phaseTick;
  c.font=font(12); c.textBaseline='middle'; c.textAlign='left';
  rows.forEach(function(r,i){
    var y=2+i*rh,mid=y+rh/2;
    c.fillStyle=r.color; c.fillText(r.label,0,mid);
    c.fillStyle='rgba(255,255,255,0.06)'; c.fillRect(labW,y+rh*0.2,bw,rh*0.6);
    var w=bw*Math.min(1,r.len/L);
    c.fillStyle=r.color; c.globalAlpha=r.self?0.5:0.35; c.fillRect(labW,y+rh*0.2,w,rh*0.6); c.globalAlpha=1;
    if(!r.self&&r.len<L){ c.strokeStyle=r.color; c.lineWidth=2; c.beginPath(); c.moveTo(labW+w,y+rh*0.1); c.lineTo(labW+w,y+rh*0.9); c.stroke(); }
    r.events.forEach(function(ev){ var ex=labW+bw*Math.min(1,ev.t/L); c.fillStyle=ev.t<t?'rgba(255,255,255,0.4)':'#f2f2ea'; diamond(c,ex,mid,rh*0.32); c.fill(); });
  });
  var hx=labW+bw*Math.min(1,t/L); c.strokeStyle='#ffffff'; c.lineWidth=1.5; c.beginPath(); c.moveTo(hx,0); c.lineTo(hx,TH); c.stroke();
}

/* ---------- effects from simulation ---------- */
function burst(x,y,color,n,speed){
  if(settings.reducedMotion) n=Math.ceil(n/3);
  for(var i=0;i<n;i++){ var a=Math.random()*Math.PI*2,v=(0.5+Math.random())*speed;
    particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.5+Math.random()*0.3,max:0.8,color:color,s:2+Math.random()*3}); }
}
function drainFx(){
  if(!game) return;
  game.fx.forEach(function(f){
    switch(f.type){
      case 'pick': Sfx.play('pick'); burst(f.x,f.y,'#d4ff1a',14,3); break;
      case 'switch': Sfx.play('switch'); rings.push({x:f.x,y:f.y,r:1,t:0,max:0.4,color:'#f2f2ea'}); break;
      case 'gateOpen': case 'gateClose': Sfx.play('gate'); break;
      case 'hurt': Sfx.play('hurt'); shake=0.3; burst(f.x,f.y,'#ff4d6d',12,3); break;
      case 'pulse': Sfx.play('pulse'); rings.push({x:f.x,y:f.y,r:Core.PULSE_RADIUS,t:0,max:0.5,color:'#ffffff'}); break;
      case 'pulseFail': Sfx.play('miss'); break;
      case 'useMiss': Sfx.play('miss'); break;
      case 'arm': Sfx.play('arm'); break;
      case 'boom': Sfx.play('boom'); shake=Math.max(shake,0.2); rings.push({x:f.x,y:f.y,r:Core.MINE_RADIUS,t:0,max:0.45,color:'#ff4d6d'}); burst(f.x,f.y,'#ff8a3d',22,4); break;
      case 'echoEnd': Sfx.play('end'); burst(f.x,f.y,echoColor(f.i),10,1.5); break;
      case 'sealed': Sfx.play('sealed'); break;
      case 'won': Sfx.play('win'); break;
      case 'lost': Sfx.play('fail'); break;
    }
  });
  game.fx.length=0;
}
function updateEffects(dt){
  particles.forEach(function(q){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=0.92; q.vy*=0.92; q.life-=dt; });
  particles=particles.filter(function(q){return q.life>0;});
  rings.forEach(function(r){ r.t+=dt; }); rings=rings.filter(function(r){return r.t<r.max;});
  shake=Math.max(0,shake-dt);
}

/* ---------- HUD ---------- */
function updateHud(){
  if(!game) return;
  var s=game,def=s.def,nrec=def.phases.filter(function(p){return p.type==='record';}).length;
  $('h-stage').textContent=def.practice?'Practice run':'Stage '+stageIndex+': '+def.name;
  var ph=$('h-phase');
  ph.className=s.isLive?'live':'rec';
  ph.textContent=s.isLive?'Live phase':'Recording '+(s.phaseIndex+1)+' of '+nrec;
  var hp='';
  for(var i=0;i<def.maxHp;i++) hp+='<span class="pip'+(i<s.hp?' on':'')+'"></span>';
  var hpEl=$('h-hp'); if(hpEl.getAttribute('data-v')!==s.hp+'/'+def.maxHp){ hpEl.innerHTML=hp; hpEl.setAttribute('data-v',s.hp+'/'+def.maxHp); hpEl.setAttribute('aria-label','Health '+s.hp+' of '+def.maxHp); }
  $('h-en').textContent=s.banked+' / '+def.required;
  $('h-time').textContent=Math.max(0,(s.phaseLen-s.phaseTick)/60).toFixed(1)+' s';
  var act=s.echoes.filter(function(e){return e.active;}).length;
  $('h-echo').textContent=act+(s.echoes.length?' of '+s.echoes.length:'');
  $('h-pulse').textContent=String(s.pulses);
  var hint=def.hints[s.phaseIndex]||'';
  if(s.isLive){
    var need=def.required-s.banked;
    hint=need>0?hint+' ('+need+' more energy needed.)':'You have enough energy. The exit is open: reach it.';
  }
  var soon=null;
  s.echoes.forEach(function(e){ if(!e.active) return; for(var k=0;k<e.rec.events.length;k++){ var ev=e.rec.events[k]; if(ev.t>=s.phaseTick){ if(!soon||ev.t<soon.t) soon={t:ev.t,i:e.i}; break; } } });
  if(soon&&s.m.switches.length) hint+=' Echo '+(soon.i+1)+' presses Use in '+((soon.t-s.phaseTick)/60).toFixed(1)+' s.';
  $('hint').textContent=hint;
  var sealBtn=document.querySelector('#tbtns [data-t="seal"]'); if(sealBtn) sealBtn.disabled=!!s.isLive;
  var pb=document.querySelector('#tbtns [data-t="pulse"]'); if(pb) pb.disabled=s.pulses<=0;
}

/* ---------- main loop ---------- */
function frame(now){
  requestAnimationFrame(frame);
  var dt=last?(now-last)/1000:0; last=now; if(dt>0.25) dt=0.25;
  clock+=settings.reducedMotion?0:dt;
  if(game&&mode==='play'&&!paused){
    acc+=dt; var n=0;
    while(acc>=Core.DT&&n<20){
      Core.step(game,takeInput()); acc-=Core.DT; n++;
      if(game.status!=='playing'){ acc=0; onStatus(); break; }
    }
  }
  drainFx(); updateEffects(dt);
  var alpha=(game&&!paused)?Math.min(1,acc/Core.DT):1;
  render(alpha);
  if(now-lastHud>100||paused){ lastHud=now; updateHud(); drawTimeline(); }
}

/* ---------- flow ---------- */
function startStage(i){
  stageIndex=i; game=Core.createStage(STAGES[i]);
  particles=[]; rings=[]; trail=[]; acc=0; clearInput();
  mode='play'; paused=true; hud.hidden=false; foot.hidden=false;
  stack=[]; resize(); updateHud(); openScreen('brief');
}
function onStatus(){
  paused=true; clearInput();
  if(game.status==='phaseEnd') openScreen('phaseEnd');
  else if(game.status==='won'){
    if(!game.def.practice){
      save.unlocked=Math.max(save.unlocked,Math.min(STAGES.length-1,stageIndex+1));
      if(stageIndex===STAGES.length-1) save.unlocked=STAGES.length;
      var prev=save.best[game.def.id]; if(prev===undefined||game.result.timeLeft>prev) save.best[game.def.id]=game.result.timeLeft;
      persist();
    }
    openScreen('result');
  }
  else if(game.status==='lost') openScreen('result');
}
function toMenu(){ game=null; mode='menu'; paused=true; hud.hidden=true; foot.hidden=true; stack=[]; staticLayer=null; resize(); openScreen('menu'); }
function openPause(){ paused=true; clearInput(); stack=[]; openScreen('pause'); }
function askRestart(){ if(mode!=='play') return; paused=true; clearInput();
  var from=screen; stack=from?[from]:['pause']; confirmAction='restart-yes';
  openScreen('confirm',{title:'Restart this stage?',text:'Your recordings and progress in this stage reset. Saved progress from completed stages is kept.',yes:'Restart stage'},true); }
function onEscape(){
  if(!overlay.classList.contains('show')){ if(mode==='play') openPause(); return; }
  if(screen==='pause'){ resume(); return; }
  if(['howto','settings','stages','confirm','chars'].indexOf(screen)>=0){ back(); return; }
}
function resume(){ closeOverlay(); paused=false; last=performance.now(); }
function back(){ var prev=stack.pop(); if(prev) openScreen(prev,null,true); else if(mode==='play') openScreen('pause',null,true); else openScreen('menu',null,true); }

function closeOverlay(){ overlay.classList.remove('show'); overlay.classList.remove('menu-bg'); screen=null; cvs.focus&&cvs.focus(); }

    case 'menu': toMenu(); break;
    case 'next-phase': Core.nextPhase(game); trail=[]; resume(); break;
    case 'next-stage': startStage(stageIndex+1); break;
    case 'retry': startStage(stageIndex); break;
    case 'toggle': var k=b.getAttribute('data-k'); settings[k]=!settings[k]; persist(); openScreen('settings',null,true); var nb=panel.querySelector('[data-k="'+k+'"]'); if(nb) nb.focus(); break;
    case 'reset': confirmAction='reset'; openScreen('confirm',{title:'Reset saved progress?',text:'This clears unlocked stages and best times in this browser. Settings are kept.',yes:'Reset progress'}); break;
  }
});
$('b-pause').addEventListener('click',function(){ if(mode==='play'&&!overlay.classList.contains('show')) openPause(); });

setupTouch();
resize();
openScreen('menu');
requestAnimationFrame(frame);
})();
</script>
